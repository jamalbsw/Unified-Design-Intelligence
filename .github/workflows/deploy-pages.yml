name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Demo-only password. It is public in this repository; see apps/web/README.md.
      VITE_PILOT_PASSWORD: design123
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            studio/template/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build site
        run: npm run build
        working-directory: apps/web

      - name: Install template preview dependencies
        run: npm ci
        working-directory: studio/template

      - name: Build template preview behind the password prompt
        run: |
          VITE_PILOT_PASSWORD_HASH="$(printf %s "$VITE_PILOT_PASSWORD" | sha256sum | cut -d' ' -f1)" npm run build
        working-directory: studio/template

      - name: Add template preview to the site
        run: cp -R studio/template/dist apps/web/dist/template-preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
