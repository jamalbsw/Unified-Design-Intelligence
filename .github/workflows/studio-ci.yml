name: Studio checks

on:
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/studio-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'studio/**'

permissions:
  contents: read

concurrency:
  group: studio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test gates and schema
        run: npm test

      - name: Validate prototype manifests
        run: npm run validate

      - name: Build library index
        run: npm run build-index

  template:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio/template
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Design system conformance
        run: npm run conformance

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Accessibility checks (build, serve, axe)
        run: npm run test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: studio/template/test-results
          if-no-files-found: ignore
